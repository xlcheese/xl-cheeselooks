# xl-Classic: a traditional bevel, as in Clearlooks.
# Light top and left edges, a faint dark bottom and right, the background
# pressed in round each button (a recess); sunken fields; flat toolbar and
# title buttons that rise on hover; boxed tabs; close hovers like the others.
#
# Alpha values are written for Depth 50. alpha_dark is used on dark surfaces
# (dark themes, dark title bars).

name = "xl-Classic"
author = "xl_cheese"
description = "A traditional bevel with a recess, sunken fields, boxed tabs."

adapt_strength = 0.6

[defaults]
roundness = 20
gradient = 30
depth = 50

[edges.raised]
border = "darker(bg, 0.25)"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.12 }
left      = { x = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.12  }
shade     = { y = -1, blur = 3, color = "black", alpha = 0.08 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.05 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.1 }

# Hover: same layers, darker border (lighter on dark themes), as Mint-Y does
[edges.raised_hover]
border = "darker(bg, 0.32)"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.19  }
left      = { x = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.19  }
shade     = { y = -1, blur = 3, color = "black", alpha = 0.05, alpha_dark = 0.03 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.03, alpha_dark = 0.01 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.1 }

[edges.linked_hover]
border    = "darker(bg, 0.32)"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.12 }
left      = { x = 1, blur = 2, color = "white", alpha = 0.50, alpha_dark = 0.12 }
shade     = { y = -1, blur = 3, color = "black", alpha = 0.08, alpha_dark = 0.03 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.03, alpha_dark = 0.01}

[edges.sunken]
border = "border_strong"
inner  = { y = 1, blur = 2, color = "black", alpha = 0.15, alpha_dark = 0.30 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.1 }

[edges.focus]
border = "accent"
ring   = { width = 1, color = "accent", alpha = 0.5 }
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }

[edges.flat]
border = "none"

[widgets]
button         = { edge = "raised", hover_edge = "raised_hover", pressed_edge = "sunken", hover_color = "lift(button, 0.85)" }
linked         = { like = "button", hover_edge = "linked_hover", hover_color = "button_hover" }
suggested      = { like = "button", border = "accent_press", hover_color = "accent_hover" }
toolbar_button = { edge = "flat", hover_edge = "raised", pressed_edge = "sunken", hover_color = "lift(header, 0.7)" }
title_button   = { like = "toolbar_button" }
close_button   = { like = "title_button", hover_color = "accent" }
entry          = { edge = "sunken", focus_edge = "focus" }
combo          = { like = "button" }
tab            = { tab_kind = "boxed", active_marker = "line", hover_color = "bg" }
menu_item      = { hover_color = "accent", hover_fg = "accent_fg" }
menubar_item   = { hover_color = "accent", hover_fg = "accent_fg" }
panel_button   = { edge = "raised", hover_edge = "raised_hover", color = "darker(button, 0.06)", hover_color = "button_hover", selected_color = "button", selected_border = "border_hover", active_marker = "line" }

[title_bar]
highlight      = 0.15   # light title bars (the default)
highlight_dark = 0.25   # dark title bars, i.e. light title text

[title_buttons]
close_hover = "hover"    # close hovers like the other two (no accent)

[panel]
color = "darker(bg, 0.03)"
menu_category = "accent"     # the main menu's selected category

[notification]
kind = "line"        # "line" (today's look), "flat" or "bordered"
color = "accent"     # optional: the line or border colour
