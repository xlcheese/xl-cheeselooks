# xl-Cheeselooks: the default style.
# Muted, softly lit buttons with a light border and a gentle drop shadow;
# sunken entries; flat toolbar and title buttons that rise on hover; boxed tabs.
# A square, darker panel with flat-looking buttons (border matches the face),
# as in xl_cheese's Mint-Y-Variable.
#
# Alpha values are written for Depth 50. alpha_dark is used on dark themes.

name = "xl-Cheeselooks"
author = "xl_cheese"
description = "Muted buttons with a light top edge, sunken fields, boxed tabs."

adapt_strength = 0.6

[defaults]
roundness = 15
gradient = 10
depth = 50
panel_opacity = 65
panel_roundness = 0

[edges.raised]
border    = "lighter(border_strong, 0.3)"
highlight = { y = 1, blur = 0, color = "white", alpha = 0.30 }
left      = { x = 1, blur = 0, color = "white", alpha = 0.10 }
shade     = { y = -1, blur = 0, color = "black", alpha = 0.02 }
right     = { x = 1, blur = 0, color = "white", alpha = 0.10 }
shadow    = { y = 3, blur = 3, color = "black", alpha = 0.06, alpha_dark = 0.30 }

# Hover: same layers, darker border (lighter on dark themes), as Mint-Y does
[edges.raised_hover]
border    = "lighter(border_hover, 0.2)"
highlight = { y = 1, blur = 0, color = "white", alpha = 0.30 }
left      = { x = 1, blur = 0, color = "white", alpha = 0.10 }
shade     = { y = -1, blur = 0, color = "black", alpha = 0.02 }
right     = { x = 1, blur = 0, color = "white", alpha = 0.10 }
shadow    = { y = 3, blur = 4, color = "black", alpha = 0.08, alpha_dark = 0.30 }

[edges.sunken]
border = "border_strong"
inner  = { y = 1, blur = 2, color = "black", alpha = 0.05, alpha_dark = 0.30 }

[edges.focus]
border = "accent"
ring   = { width = 1, color = "accent", alpha = 0.5 }
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }

[edges.flat]
border = "none"

[edges.panel_raised]
border = "darker(button, 0.09)"
shade  = { y = -4, blur = 9, color = "black", alpha = 0.03 }
 
[edges.panel_hover]
border = "button"
shade  = { y = -1, color = "black", alpha = 0.08 }

[widgets]
button         = { edge = "raised", hover_edge = "raised_hover", pressed_edge = "sunken", hover_color = "button_hover" }
suggested      = { like = "button", border = "accent_press", hover_color = "accent_hover" }
toolbar_button = { edge = "flat", hover_edge = "raised", pressed_edge = "sunken", hover_color = "lighter(header, 0.7)" }
title_button   = { like = "toolbar_button" }
close_button   = { like = "title_button", hover_color = "accent" }
entry          = { edge = "sunken", focus_edge = "focus" }
combo          = { like = "button" }
tab            = { tab_kind = "boxed", active_marker = "none", hover_color = "lighter(header, 0.6)" }
menu_item      = { hover_color = "menu_hover" }
menubar_item   = { hover_color = "menubar_hover" }
panel_button   = { edge = "panel_raised", hover_edge = "panel_hover", color = "darker(button, 0.09)", hover_color = "button", selected_color = "button", selected_border = "button", spacing = 3 }

[panel]
color = "darker(bg, 0.14)"
