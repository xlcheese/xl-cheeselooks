# xl-Classic-Dark: xl-Classic for dark colours.
# The same design as xl-Classic, retuned for a dark background: ink outlines
# (darker than the surface) where the light style draws grey lines, hover
# borders that brighten toward the text, a stronger drop shadow, faint glints
# instead of bright highlights, and a recess that still shows on dark grey.
# Built from xl_cheese's xl-Classic (tools: see docs/design-spec.md).
#
# Alpha values are written for Depth 50. alpha_dark is what dark colours use;
# alpha is the fallback if you pair this style with light colours.

name = "xl-Classic-Dark"
author = "xl_cheese, dark tuning by Claude"
description = "A traditional bevel with a recess, sunken fields, boxed tabs. xl-Classic for dark colours."

adapt_strength = 0.6
dividers = "lift(bg, 0.95)"

[defaults]
roundness = 20
gradient = 30
depth = 50

[edges.raised]
border    = "darker(bg, 0.40)"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.12 }
left      = { x = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.12  }
shade     = { y = -1, blur = 3, color = "black", alpha = 0.08, alpha_dark = 0.15 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.05, alpha_dark = 0.13 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.08, alpha_dark = 0.18 }

# Hover: same layers, darker border (lighter on dark themes), as Mint-Y does
[edges.raised_hover]
border    = "darker(bg, 0.35)"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.19  }
left      = { x = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.19  }
shade     = { y = -1, blur = 3, color = "black", alpha = 0.05, alpha_dark = 0.20 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.03, alpha_dark = 0.20 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.08, alpha_dark = 0.18 }

[edges.linked_hover]
border    = "darker(bg, 0.35)"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.12 }
left      = { x = 1, blur = 2, color = "white", alpha = 0.50, alpha_dark = 0.12 }
shade     = { y = -1, blur = 3, color = "black", alpha = 0.08, alpha_dark = 0.03 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.03, alpha_dark = 0.01}

[edges.sunken]
border = "darker(bg, 0.20)"
inner  = { y = 1, blur = 2, color = "black", alpha = 0.15, alpha_dark = 0.66 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.16, alpha_dark = 0.08 }
#recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.06, alpha_dark = 0.30 }

[edges.focus]
border = "accent"
ring   = { width = 1, color = "accent", alpha = 0.5 }
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }

[edges.flat]
border = "none"

[widgets]
button         = { edge = "raised", hover_edge = "raised_hover", pressed_edge = "sunken", hover_color = "lift(button, 0.40)" }
linked         = { like = "button", hover_edge = "linked_hover", hover_color = "button_hover" }
suggested      = { like = "button", border = "darker(accent, 0.4)", hover_color = "accent_hover" }
destructive    = { like = "button", hover_color = "destructive", border = "darker(destructive, 0.4)" }
toolbar_button = { edge = "flat", hover_edge = "raised", pressed_edge = "sunken", hover_color = "lift(header, 0.7)" }
title_button   = { like = "toolbar_button" }
close_button   = { like = "title_button", hover_color = "accent" }
entry          = { edge = "sunken", focus_edge = "focus" }
combo          = { like = "button" }
tab            = { tab_kind = "boxed", active_marker = "line", hover_color = "bg" }
menu_item      = { hover_color = "accent", hover_fg = "accent_fg" }
menubar_item   = { hover_color = "accent", hover_fg = "accent_fg" }
panel_button   = { edge = "raised", hover_edge = "raised_hover", color = "darker(button, 0.06)", hover_color = "lift(button, 0.19)", selected_color = "button", selected_border = "border_hover", active_marker = "line" }

[title_bar]
highlight      = 0.15   # light title bars (the default)
highlight_dark = 0.25   # dark title bars, i.e. light title text

[title_buttons]
close_hover = "hover"    # close hovers like the other two (no accent)

[panel]
color = "darker(bg, 0.03)"
menu_category = "accent"           # the main menu's selected category
menu_hover    = "lift(bg, 0.99)"   # the main menu's hover

[notification]
kind = "line"        # "line" (today's look), "flat" or "bordered"
color = "accent"     # optional: the line or border colour
