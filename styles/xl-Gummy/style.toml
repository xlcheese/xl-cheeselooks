# xl-Gummy: bright and crisp.
# Light edges all round with little blur, a brighter, crisper sibling of
# xl-Classic; joined buttons get a stronger bevel on hover; sunken
# entries; flat toolbar and title buttons that rise on hover; boxed tabs with
# an accent glow on the selected tab, and on the focused window's panel button;
# accent scrollbar thumbs with a crisp outline, as Clearlooks Gummy had.
#
# Alpha values are written for Depth 50. alpha_dark is used on dark themes.

name = "xl-Gummy"
author = "xl_cheese"
description = "Bright, crisp buttons, sunken fields, boxed tabs with an accent glow."

adapt_strength = 0.6

# Glossy faces, as in Clearlooks Gummy: a crisp step at the middle of every
# gradient (buttons, selection, menu and sidebar hover). split_step 0-1: how
# sharp the step is. The Gradient slider still sets the overall strength.
gradient_shape = "split"
split_step = 0.6

[defaults]
roundness = 20
gradient = 30
depth = 50

[edges.raised]
border    = "border_strong"
highlight = { y = 2, blur = 1, color = "white", alpha = 0.30 }
left      = { x = 1, blur = 1, color = "white", alpha = 0.20 }
shade     = { y = -2, blur = 1, color = "black", alpha = 0.02 }
right     = { x = 2, blur = 1, color = "white", alpha = 0.2 }
shadow    = { y = 1, blur = 2, color = "black", alpha = 0.03, alpha_dark = 0.30 }

# Hover: same layers, darker border (lighter on dark themes), as Mint-Y does
[edges.raised_hover]
border    = "border_hover"
highlight = { y = 2, blur = 1, color = "white", alpha = 0.30 }
left      = { x = 1, blur = 1, color = "white", alpha = 0.20 }
shade     = { y = -2, blur = 1, color = "black", alpha = 0.02 }
right     = { x = 2, blur = 1, color = "white", alpha = 0.2 }
shadow    = { y = 1, blur = 2, color = "black", alpha = 0.03, alpha_dark = 0.30 }

[edges.linked_hover]
border    = "darker(border_hover, 0.04)"
highlight = { y = 2, blur = 2, color = "white", alpha = 0.60 }
left      = { x = 2, blur = 2, color = "white", alpha = 0.50 }
shade     = { y = -2, blur = 2, color = "black", alpha = 0.05 }
right     = { x = 2, blur = 3, color = "black", alpha = 0.03 }


[edges.sunken]
border = "border_strong"
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }

[edges.focus]
border = "accent"
ring   = { width = 1, color = "accent", alpha = 0.5 }
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }

[edges.flat]
border = "none"

[widgets]
button         = { edge = "raised", hover_edge = "raised_hover", pressed_edge = "sunken", hover_color = "button_hover" }
linked         = { like = "button", hover_edge = "linked_hover", hover_color = "lighter(button_hover, 0.7)" }
suggested      = { like = "button", border = "accent_press", hover_color = "accent_hover" }
toolbar_button = { edge = "flat", hover_edge = "raised", pressed_edge = "sunken", hover_color = "lighter(header, 0.7)" }
title_button   = { like = "toolbar_button" }
close_button   = { like = "title_button", hover_color = "accent" }
entry          = { edge = "sunken", focus_edge = "focus" }
combo          = { like = "button" }
tab            = { tab_kind = "boxed", active_marker = "glow", hover_color = "bg" }
menu_item      = { hover_color = "menu_hover" }
menubar_item   = { hover_color = "menubar_hover" }
panel_button   = { edge = "raised", hover_edge = "raised_hover", color = "darker(button, 0.03)", hover_color = "lighter(button_hover,0.05)", selected_color = "button", selected_border = "border_hover", active_marker = "glow"}
scrollbar      = { color = "accent", hover_color = "accent_hover", pressed_color = "accent_press", border = "accent_press" }
