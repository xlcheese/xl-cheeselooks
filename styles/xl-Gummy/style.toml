# xl-Gummy: bright and crisp, with glass faces (light reflected from below).
# Light edges all round with little blur, a brighter, crisper sibling of
# xl-Classic; joined buttons get a stronger bevel on hover; sunken
# entries; flat toolbar and title buttons that rise on hover; boxed tabs with
# an accent glow on the selected tab, and on the focused window's panel button;
# accent scrollbar thumbs with a crisp outline, as Clearlooks Gummy had.
#
# Alpha values are written for Depth 50. alpha_dark is used on dark themes.

name = "xl-Gummy"
author = "xl_cheese"
description = "Bright, crisp glass buttons, sunken fields, boxed tabs with an accent glow."

adapt_strength = 0.6

# Glossy faces, as in Clearlooks Gummy: a crisp step at the middle of every
# gradient (buttons, selection, menu and sidebar hover). split_step 0-1: how
# sharp the step is. The Gradient slider still sets the overall strength.
gradient_shape = "glass"
split_step = 0.7       # the step at the middle (0 = no step, a smooth dip)
glass_return = 0.7     # how far the bottom fades back up toward the top colour

[defaults]
roundness = 20
gradient = 30
depth = 50

[edges.raised]
border    = "border_strong"
highlight = { y = 1, blur = 2, color = "white", alpha = 0.20, alpha_dark = 0.07 }
left      = { x = 1, blur = 1, color = "white", alpha = 0.20, alpha_dark = 0.07 }
shade     = { y = -2, blur = 1, color = "black", alpha = 0.02 }
right     = { x = 1, blur = 1, color = "white", alpha = 0.2, alpha_dark = 0.07 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.1 }

# Hover: same layers, darker border (lighter on dark themes), as Mint-Y does
[edges.raised_hover]
border    = "border_hover"
highlight = { y = 2, blur = 2, color = "white", alpha = 0.30, alpha_dark = 0.1 }
left      = { x = 1, blur = 2, color = "white", alpha = 0.20, alpha_dark = 0.07 }
shade     = { y = -2, blur = 1, color = "black", alpha = 0.02 }
recess = { color = "black", alpha = 0.10, light = "white", light_alpha = 0.35, light_alpha_dark = 0.1 }

[edges.linked_hover]
border    = "darker(border_hover, 0.04)"
highlight = { y = 2, blur = 2, color = "white", alpha = 0.60, alpha_dark = 0.2 }
left      = { x = 1, blur = 3, color = "white", alpha = 0.50, alpha_dark = 0.17 }
shade     = { y = -2, blur = 2, color = "black", alpha = 0.05 }
right     = { x = 1, blur = 3, color = "black", alpha = 0.03 }

[edges.sunken]
border = "border_strong"
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }
recess = { color = "black", alpha = 0.08, light = "white", light_alpha = 0.35, light_alpha_dark = 0.1 }

[edges.focus]
border = "accent"
ring   = { width = 1, color = "accent", alpha = 0.5 }
inner  = { y = 1, blur = 2, color = "black", alpha = 0.10, alpha_dark = 0.30 }

[edges.flat]
border = "none"

[widgets]
button         = { edge = "raised", hover_edge = "raised_hover", pressed_edge = "sunken", color = "darker(button, 0.02)", hover_color = "lift(button, 0.85)" }
linked         = { like = "button", hover_edge = "linked_hover", hover_color = "lift(button_hover, 0.7)" }
suggested      = { like = "button", border = "accent_press", hover_color = "accent_hover" }
toolbar_button = { edge = "flat", hover_edge = "raised", pressed_edge = "sunken", hover_color = "lift(header, 0.7)" }
title_button   = { like = "toolbar_button" }
close_button   = { like = "title_button", hover_color = "accent" }
entry          = { edge = "sunken", focus_edge = "focus" }
combo          = { like = "button" }
tab            = { tab_kind = "boxed", active_marker = "glow", hover_color = "bg" }
menu_item      = { hover_color = "accent" }
menubar_item   = { hover_edge = "raised", hover_color = "accent" }
panel_button   = { edge = "raised", hover_edge = "raised_hover", color = "darker(button, 0.03)", hover_color = "lift(button_hover,0.05)", selected_color = "button", selected_border = "border_hover", active_marker = "glow"}
scrollbar      = { color = "accent", hover_color = "accent_hover", pressed_color = "accent_press", border = "accent_press" }

[title_bar]
highlight      = 0.15   # light title bars (the default)
highlight_dark = 0.25   # dark title bars, i.e. light title text

[panel]
color = "darker(bg, 0.03)"

[notification]
kind = "bordered"        # "line" (today's look), "flat" or "bordered"
color = "accent"     # optional: the line or border colour
